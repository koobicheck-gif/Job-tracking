<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
  <!-- ─── Diamond / handshake body (navy) ─── -->
  <!-- Left arm: upper-left shoulder → lower center -->
  <polygon points="40,120 130,120 160,250 70,250" fill="#1B2D4F"/>
  <!-- Right arm: upper-right shoulder → lower center -->
  <polygon points="240,120 150,120 120,250 210,250" fill="#1B2D4F"/>
  <!-- Cap the bottom so it's a clean point -->
  <polygon points="120,250 140,270 160,250" fill="#1B2D4F"/>
  <!-- White triangle between arms at top (house interior) -->
  <polygon points="140,62 180,120 100,120" fill="white"/>

  <!-- ─── 4-pane window ─── -->
  <rect x="122" y="70" width="36" height="32" rx="2" fill="#1B2D4F"/>
  <rect x="123" y="71" width="15" height="14" rx="1" fill="#2A3F6B"/>
  <rect x="141" y="71" width="16" height="14" rx="1" fill="#2A3F6B"/>
  <rect x="123" y="87" width="15" height="14" rx="1" fill="#2A3F6B"/>
  <rect x="141" y="87" width="16" height="14" rx="1" fill="#2A3F6B"/>
  <line x1="122" y1="85" x2="158" y2="85" stroke="white" stroke-width="2.5"/>
  <line x1="140" y1="70" x2="140" y2="102" stroke="white" stroke-width="2.5"/>

  <!-- ─── Clasped-hands highlight ─── -->
  <ellipse cx="140" cy="200" rx="45" ry="26" fill="#253060"/>
  <!-- Grip lines -->
  <path d="M110,196 Q122,183 140,185 Q158,183 170,196" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="118" y1="200" x2="112" y2="216" stroke="rgba(255,255,255,0.30)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="128" y1="204" x2="124" y2="220" stroke="rgba(255,255,255,0.30)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="152" y1="204" x2="156" y2="220" stroke="rgba(255,255,255,0.30)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="162" y1="200" x2="168" y2="216" stroke="rgba(255,255,255,0.30)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ─── Red roof chevron ─── -->
  <!-- Main chevron shape -->
  <polygon points="140,8 264,132 248,148 140,36 32,148 16,132" fill="#C0392B"/>
</svg>
